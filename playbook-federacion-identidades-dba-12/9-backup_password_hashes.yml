---
# =============================================================================
# 9-backup_password_hashes.yml
# Respalda password hashes de SYS.USER$ para Oracle 12.1/12.2.
#
# Diferencia con 19c: no usa oracle_maintained (no existe en 12.1).
# Filtra por la lista de usuarios descubiertos.
#
# Uso:
#   ansible-playbook 9-backup_password_hashes.yml --ask-vault-pass
# =============================================================================

- name: Respaldar password hashes (Oracle 12c)
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    reports_dir: "./Reportes"
    output_base: "{{ reports_dir }}/password_backup_{{ ansible_date_time.date }}_{{ ansible_date_time.hour }}{{ ansible_date_time.minute }}{{ ansible_date_time.second }}"

  tasks:
    - name: Buscar reportes de descubrimiento
      ansible.builtin.find:
        paths: "{{ reports_dir }}"
        patterns: "oracle_discovery_*"
        file_type: directory
      register: discovery_dirs

    - name: Validar descubrimiento
      ansible.builtin.assert:
        that: discovery_dirs.files | length > 0
        fail_msg: "Ejecuta primero 1-oracle_users_discovery.yml"

    - name: Determinar descubrimiento mas reciente
      ansible.builtin.set_fact:
        latest_discovery: "{{ (discovery_dirs.files | sort(attribute='mtime', reverse=true) | first).path }}"

    - name: Cargar usuarios descubiertos
      ansible.builtin.include_tasks: tasks/load_discovery.yml
      loop: "{{ oracle_databases }}"
      loop_control:
        loop_var: db
        label: "{{ db.name }}"

    - name: Clasificar usuarios
      ansible.builtin.set_fact:
        migrate_users: "{{ oracle_users_list | difference(oracle_no_migrate) }}"
        no_migrate_users: "{{ oracle_users_list | intersect(oracle_no_migrate) }}"
        all_users: "{{ oracle_users_list }}"

    - name: Extraer hashes de SYS.USER$
      ansible.builtin.script:
        cmd: >
          scripts/oracle_query.py '{{ ({
            "host": item.host,
            "port": item.port,
            "service": item.service,
            "user": oracle_user,
            "password": oracle_password,
            "query": "SELECT u.name AS username, u.password AS password_hash, u.spare4 AS spare4_hash FROM sys.user$ u WHERE u.type# = 1 AND u.name IN (" + (all_users | map("regex_replace", "^(.*)$", "'\\1'") | join(",")) + ") ORDER BY u.name",
            "binds": {}
          }) | to_json }}'
      loop: "{{ oracle_databases }}"
      loop_control:
        label: "{{ item.name }}"
      register: hashes_raw

    - name: Crear directorio de salida
      ansible.builtin.file:
        path: "{{ output_base }}"
        state: directory
        mode: "0700"

    - name: Parsear resultados
      ansible.builtin.set_fact:
        hash_results: "{{ hashes_raw.results[0].stdout | from_json }}"

    - name: Separar hashes por categoria
      ansible.builtin.set_fact:
        hashes_migrate: "{{ hash_results | selectattr('USERNAME', 'in', migrate_users) | list }}"
        hashes_no_migrate: "{{ hash_results | selectattr('USERNAME', 'in', no_migrate_users) | list }}"

    - name: Guardar hashes (JSON)
      ansible.builtin.copy:
        content: "{{ item.data | to_nice_json }}"
        dest: "{{ output_base }}/{{ item.file }}"
        mode: "0600"
      loop:
        - { file: "hashes_migrar.json", data: "{{ hashes_migrate }}" }
        - { file: "hashes_no_migrar.json", data: "{{ hashes_no_migrate }}" }
        - { file: "hashes_todos.json", data: "{{ hash_results }}" }
      loop_control:
        label: "{{ item.file }}"

    - name: Generar script de restauracion
      ansible.builtin.copy:
        dest: "{{ output_base }}/restore_passwords.sql"
        mode: "0600"
        content: |
          -- SCRIPT DE RESTAURACION DE PASSWORDS (Oracle 12c)
          -- Generado: {{ ansible_date_time.iso8601 }}
          -- Ejecutar como: sqlplus / as sysdba @restore_passwords.sql

          {% for user in hashes_migrate %}
          {% if user.SPARE4_HASH is not none and user.SPARE4_HASH != '' %}
          ALTER USER {{ user.USERNAME }} IDENTIFIED BY VALUES '{{ user.SPARE4_HASH }}';
          {% elif user.PASSWORD_HASH is not none and user.PASSWORD_HASH != '' %}
          ALTER USER {{ user.USERNAME }} IDENTIFIED BY VALUES '{{ user.PASSWORD_HASH }}';
          {% else %}
          -- ADVERTENCIA: {{ user.USERNAME }} no tiene hash respaldable
          {% endif %}
          {% endfor %}

          PROMPT >>> Passwords restaurados.

    - name: Resumen
      ansible.builtin.debug:
        msg:
          - "=== BACKUP DE HASHES COMPLETADO ==="
          - "Directorio: {{ output_base }}"
          - "Candidatos a migrar: {{ hashes_migrate | length }}"
          - "No migrar: {{ hashes_no_migrate | length }}"
